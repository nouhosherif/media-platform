services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media}
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cache:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    depends_on:
      database: { condition: service_healthy }
      cache: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "8080:80"
    volumes:
      - media-data:/srv/media:ro
      - static-data:/srv/static:ro

volumes:
  postgres-data:
  redis-data:
  media-data:
  static-data:
